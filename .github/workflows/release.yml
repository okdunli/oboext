name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# No test gate: the app ships no test suite of its own. A pushed tag goes
# straight to the notes generator and the release job.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the notes need every tag and the commits between them
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          # every release so far ships as a pre-release
          prerelease: true
